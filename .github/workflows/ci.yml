name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.11", "3.12", "3.13" ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Syntax check
        run: |
          python -m compileall -q ctf realexec.py scripts workflow.py core.py app.py

      - name: Toolbox self-check
        run: python -m ctf selftest

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Demo (offline solving + learning loop)
        run: python -m ctf --db /tmp/ci_kb.db demo

      - name: Real-exec safety boundary check
        run: |
          # 默认必须是 simulated；公网目标必须被 blocked
          python realexec.py --tool nmap --target 127.0.0.1 | grep -q simulated
          python realexec.py --tool nmap --target 8.8.8.8 --real --authorized | grep -q blocked
          echo "safety boundaries OK"
